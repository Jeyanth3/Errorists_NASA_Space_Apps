[project]
name = "firewise"
version = "0.1.0"
description = "Mission-aware evidence ranking for spacecraft fire safety (NASA Space Apps 2026, team Errorists)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
